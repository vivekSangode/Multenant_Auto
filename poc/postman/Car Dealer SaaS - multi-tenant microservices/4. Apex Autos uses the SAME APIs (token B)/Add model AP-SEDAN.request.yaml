$kind: http-request
url: "{{vehicle}}/api/v1/vehicle/models"
method: POST
headers:
  Authorization: Bearer {{tokenB}}
  Content-Type: application/json
body:
  type: text
  content: '{ "modelCode": "AP-SEDAN", "name": "Apex Sedan", "bodyType": "SEDAN", "fuelType": "PETROL", "basePrice": 980000 }'
scripts:
  - type: afterResponse
    code: pm.test('201', () => pm.response.to.have.status(201));
    language: text/javascript
order: 1000
