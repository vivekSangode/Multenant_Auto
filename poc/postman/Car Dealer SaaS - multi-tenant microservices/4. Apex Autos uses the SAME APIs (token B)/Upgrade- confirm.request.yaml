$kind: http-request
name: "Upgrade: confirm"
url: "{{cp}}/api/v1/platform/orders/{{orderB2}}/confirm"
method: POST
headers:
  Authorization: Bearer {{platformToken}}
scripts:
  - type: afterResponse
    code: pm.test('2xx', () => pm.response.to.be.success);
    language: text/javascript
order: 8000
