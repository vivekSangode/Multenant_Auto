$kind: http-request
name: "A10 Company login: token of realm co-n (tenant_id = companyA)"
url: "{{kc}}/realms/{{realmA}}/protocol/openid-connect/token"
method: POST
headers:
  Content-Type: application/x-www-form-urlencoded
body:
  type: urlencoded
  content:
    grant_type: password
    client_id: erp-web
    username: "{{ownerEmailA}}"
    password: "{{ownerPasswordA}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('200', () => pm.response.to.have.status(200));
      const t = pm.response.json();
      pm.collectionVariables.set('tokenA', t.access_token);
      pm.collectionVariables.set('tokenAExp', Date.now() + t.expires_in * 1000);
      pm.collectionVariables.set('acceptedA', true);
      const claims = JSON.parse(atob(t.access_token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
      pm.test('tenant_id is the company', () => pm.expect(claims.tenant_id).to.eql(pm.collectionVariables.get('companyA')));
      console.log('Velocity Motors token claims', claims);
    language: text/javascript
order: 10000
