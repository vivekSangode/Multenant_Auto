$kind: http-request
name: "A8 Accept the invitation: set password (no SMTP in the POC)"
url: "{{kc}}/admin/realms/{{realmA}}/users/{{ownerIdA}}/reset-password"
method: PUT
headers:
  Authorization: Bearer {{operatorToken}}
  Content-Type: application/json
body:
  type: text
  content: '{ "type": "password", "value": "{{ownerPasswordA}}", "temporary": false }'
scripts:
  - type: afterResponse
    code: pm.test('204', () => pm.response.to.have.status(204));
    language: text/javascript
order: 8000
