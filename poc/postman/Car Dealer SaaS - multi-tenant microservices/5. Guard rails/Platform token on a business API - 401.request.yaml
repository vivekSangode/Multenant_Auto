$kind: http-request
name: Platform token on a business API -> 401
url: "{{vehicle}}/api/v1/vehicle/models"
method: GET
headers:
  Authorization: Bearer {{platformToken}}
scripts:
  - type: afterResponse
    code: pm.test('401', () => pm.response.to.have.status(401));
    language: text/javascript
order: 2000
