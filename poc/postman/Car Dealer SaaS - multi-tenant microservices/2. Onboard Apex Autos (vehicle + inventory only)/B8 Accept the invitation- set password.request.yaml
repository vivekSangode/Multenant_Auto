$kind: http-request
name: "B8 Accept the invitation: set password"
url: "{{kc}}/admin/realms/{{realmB}}/users/{{ownerIdB}}/reset-password"
method: PUT
headers:
  Authorization: Bearer {{operatorToken}}
  Content-Type: application/json
body:
  type: text
  content: '{ "type": "password", "value": "{{ownerPasswordB}}", "temporary": false }'
scripts:
  - type: afterResponse
    code: pm.test('204', () => pm.response.to.have.status(204));
    language: text/javascript
order: 8000
