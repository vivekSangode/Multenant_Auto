# Shared platform infrastructure for the POC (master §3.1: only infrastructure is shared).
services:
  mysql:
    image: mysql:8.4
    container_name: erp-poc-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3307:3306"
    volumes:
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7.4
    container_name: erp-poc-redis
    ports:
      - "6380:6379"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: erp-poc-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9091:9001"   # MinIO console
    volumes:
      - minio-data:/data

  # Identity (CD-06, CD-17): realm `erp-platform` is imported from ./keycloak; company realms co-<n> are created
  # by the CREATE_REALM provisioning step through the `erp-realm-provisioner` service account.
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.5
    container_name: erp-poc-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin          # Keycloak console (operator) only
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_BOOTSTRAP_ADMIN_CLIENT_ID: erp-realm-provisioner
      KC_BOOTSTRAP_ADMIN_CLIENT_SECRET: erp-realm-provisioner-secret
    ports:
      - "8180:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data          # dev-file DB: company realms survive restarts like MySQL
      - ./keycloak:/opt/keycloak/data/import:ro

volumes:
  mysql-data:
  minio-data:
  keycloak-data:
